<!-- @dsCard group="grader · 정적 핸드오프" viewport="1280x880" name="로그인" subtitle="Supabase Auth 이메일+비밀번호 로그인(배포 게이트)" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STIZ grader · 로그인</title>
<link rel="icon" href="../assets/logos/stiz-favicon-32.png" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-25..0" />
<link rel="stylesheet" href="app.css" />
<style>
  /* 로그인 화면은 사이드바 없이 중앙 정렬 카드 하나만 둔다(가장 단순). */
  .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card { width:100%; max-width:380px; }
  .login-brand { display:flex; align-items:center; gap:8px; justify-content:center; margin-bottom:20px; }
  .login-brand img { height:28px; }
  .login-field { margin-bottom:14px; }
  .login-field label { display:block; font-size:13px; color:var(--text-subtle); margin-bottom:6px; }
  .login-field input { width:100%; }
  .login-msg { margin-top:12px; min-height:20px; font-size:13px; }
  .login-msg.is-error { color:var(--danger, #d33); }
  .login-msg.is-ok { color:var(--text-subtle); }
  .login-btn { width:100%; margin-top:8px; }
  /* 회사 구글 계정 로그인 — 설정(google_client_id)이 있을 때만 보인다 */
  .google-area { margin-bottom:18px; }
  .google-btn { display:flex; justify-content:center; min-height:44px; }
  .login-or { display:flex; align-items:center; gap:10px; margin-top:18px; font-size:12px; color:var(--text-subtle); }
  .login-or::before, .login-or::after { content:""; flex:1; height:1px; background:var(--border-subtle); }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="card card--pad login-card">
    <div class="login-brand">
      <img src="../assets/logos/stiz-logo-black.png" alt="STIZ" />
      <span class="tag">grader</span>
    </div>

    <h1 class="page-title" style="text-align:center; margin-bottom:18px;">로그인</h1>

    <div class="google-area hidden" id="googleArea">
      <div class="google-btn" id="googleBtn"></div>
      <div class="login-or">또는 비밀번호로</div>
    </div>

    <form id="loginForm" autocomplete="on">
      <div class="login-field">
        <label for="email">이메일</label>
        <input class="input" type="email" id="email" name="email" required placeholder="name@stiz.co.kr" />
      </div>
      <div class="login-field">
        <label for="password">비밀번호</label>
        <input class="input" type="password" id="password" name="password" required placeholder="비밀번호" />
      </div>
      <button class="btn btn--primary login-btn" type="submit" id="loginBtn">로그인</button>
    </form>

    <div class="login-msg" id="loginMsg"></div>
  </div>
</div>

<!-- Supabase JS SDK(CDN). 빌드 없이 곧장 쓴다(빌드 0 원칙). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* 로그인 화면 동작 개요(비유):
   1) 서버에 "공개 설정 줘"(/api/public-config) 하고 물어 Supabase URL/공개키·인증여부를 받는다.
      - 인증이 꺼져 있으면(로컬) 로그인 불필요 → 곧장 작업 화면으로 보낸다.
   2) 이미 유효한 세션(토큰)이 있으면 다시 로그인할 필요 없이 곧장 작업 화면으로 보낸다.
   3) 없으면 이메일+비번으로 Supabase 로그인을 시도한다.
   4) 성공하면 받은 access_token 을 sessionStorage 에 저장하고 work.html 로 이동한다.
      (sessionStorage = 탭을 닫으면 비워지는 '임시 출입증 보관함')
*/
const TOKEN_KEY = "grader_access_token";   // 다른 화면의 apiFetch 가 읽는 키와 동일해야 함
// 로그인 뒤 돌아갈 화면 — ?next=intake.html 처럼 받되, 정해 둔 화면 이름만 허용한다
// (아무 주소나 받으면 로그인 뒤 다른 사이트로 튕기게 만들 수 있다)
const NEXT_OK = ["work.html", "patterns.html", "history.html", "settings.html", "intake.html"];
const NEXT = "/static/screens/" + (NEXT_OK.find((n) => n === new URLSearchParams(location.search).get("next")) || "work.html");
const msgEl = document.getElementById("loginMsg");
const btnEl = document.getElementById("loginBtn");
let supa = null;

function showMsg(text, kind) {
  msgEl.textContent = text || "";
  msgEl.className = "login-msg" + (kind ? " is-" + kind : "");
}

// 1) 공개 설정 로드 → Supabase 클라이언트 준비(인증 꺼져 있으면 바로 통과).
async function init() {
  let cfg = {};
  try {
    const res = await fetch("/api/public-config");
    cfg = await res.json();
  } catch (e) {
    showMsg("서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.", "error");
    return;
  }
  // 인증이 꺼진 환경(로컬)이면 로그인 절차가 의미 없으므로 곧장 작업 화면으로.
  if (!cfg.auth_required) {
    location.replace(NEXT);
    return;
  }
  if (!cfg.supabase_url || !cfg.supabase_publishable_key) {
    showMsg("로그인 설정이 준비되지 않았습니다(관리자에게 문의).", "error");
    return;
  }
  // window.supabase 는 CDN SDK 가 노출하는 전역. createClient 로 클라이언트 생성.
  supa = window.supabase.createClient(cfg.supabase_url, cfg.supabase_publishable_key);

  // 2) 이미 유효한 세션이 있으면(직전 로그인 후 새로고침·루트 재진입 등) 작업 화면 직행.
  //    Supabase SDK 가 토큰을 자체 보관(localStorage)하므로 getSession 으로 확인한다.
  //    유효하면 access_token 을 우리 sessionStorage 키에도 실어(apiFetch 가 읽음) 넘긴다.
  try {
    const { data } = await supa.auth.getSession();
    const token = data && data.session && data.session.access_token;
    if (token) {
      sessionStorage.setItem(TOKEN_KEY, token);
      location.replace(NEXT);
      return;
    }
  } catch (e) {
    // 세션 확인 실패는 치명적이지 않다 — 그냥 로그인 폼을 보여 준다.
  }

  // 회사 구글 계정 로그인 — 설정이 있을 때만 버튼을 그린다(없으면 비밀번호 로그인만)
  if (cfg.google_client_id) setupGoogle(cfg.google_client_id);
}

/* ===== 회사 구글 계정(@stiz.kr)으로 로그인 =====
   비유: 사원증(구글 계정)을 찍으면 구글이 «이 사람 맞다»는 확인서(ID 토큰)를 주고,
   Supabase 가 그 확인서를 검사해 «같은 이메일로 이미 등록된 직원 계정»으로 들여보낸다.
   · 새 가입은 Supabase 에서 막혀 있다 → 등록 안 된 사람은 구글로도 못 들어온다(계정을 만들지 않는다)
   · 번호표(nonce): 구글에는 SHA-256 으로 바꾼 값을, Supabase 에는 원래 값을 준다(Supabase 문서 방식)
     — 다른 화면에서 받은 확인서를 가져다 쓰는 것을 막는다. 한 번 쓰면 새로 만든다. */
const GOOGLE_DOMAIN = "stiz.kr";
let googleClientId = "", googleNonce = "";

function loadGis() {
  return new Promise((resolve, reject) => {
    if (window.google && window.google.accounts && window.google.accounts.id) return resolve();
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("gis"));
    document.head.appendChild(s);
  });
}

async function newNonce() {
  const raw = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(32))));
  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(raw));
  const hashed = Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, "0")).join("");
  return { raw, hashed };
}

async function prepareGoogle() {
  const n = await newNonce();
  googleNonce = n.raw;
  window.google.accounts.id.initialize({
    client_id: googleClientId,
    callback: onGoogleCredential,
    nonce: n.hashed,
    hd: GOOGLE_DOMAIN,                     // 회사 계정 고르기 힌트 — 실제로 막는 건 «등록된 계정만» 규칙이다
    ux_mode: "popup",
    auto_select: false,
    cancel_on_tap_outside: true,
    context: "signin",
  });
  const box = document.getElementById("googleBtn");
  box.innerHTML = "";
  window.google.accounts.id.renderButton(box, {
    type: "standard", theme: "outline", size: "large", text: "signin_with",
    shape: "rectangular", logo_alignment: "left", locale: "ko",
    width: Math.min(box.clientWidth || 320, 400),
  });
}

async function setupGoogle(clientId) {
  googleClientId = clientId;
  try {
    await loadGis();
    document.getElementById("googleArea").classList.remove("hidden");
    await prepareGoogle();
  } catch (e) {
    // 구글 스크립트를 못 불러오면 비밀번호 로그인만 쓴다 — 오류를 띄우지 않는다
    document.getElementById("googleArea").classList.add("hidden");
  }
}

// 구글 확인서 안의 회사 도메인(hd)을 먼저 본다 — 개인 계정이면 Supabase 에 보내기 전에 알려 준다
function googleDomainOf(credential) {
  try {
    const part = credential.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    return String(JSON.parse(decodeURIComponent(escape(atob(part)))).hd || "").toLowerCase();
  } catch (e) { return ""; }
}

function googleErrorText(error) {
  const m = String((error && error.message) || error || "");
  if (/signups? not allowed|signup is disabled|user not found/i.test(m)) return "등록된 직원 계정이 아닙니다. 관리자에게 그레이더 계정 등록을 요청해 주세요.";
  if (/provider is not enabled|unsupported provider|not enabled/i.test(m)) return "구글 로그인 설정이 아직 끝나지 않았습니다(관리자에게 문의).";
  if (/nonce/i.test(m)) return "로그인 확인 시간이 지났습니다. 구글 버튼을 다시 눌러 주세요.";
  if (/audience|client.?id/i.test(m)) return "구글 로그인 설정이 맞지 않습니다(관리자에게 문의).";
  return "구글 로그인에 실패했습니다. 잠시 후 다시 시도해 주세요.";
}

async function onGoogleCredential(response) {
  const credential = response && response.credential;
  if (!credential || !supa) { showMsg("구글 로그인 정보를 받지 못했습니다. 다시 시도해 주세요.", "error"); return; }
  if (googleDomainOf(credential) !== GOOGLE_DOMAIN) {
    showMsg("회사 구글 계정(@" + GOOGLE_DOMAIN + ")으로만 로그인할 수 있습니다.", "error");
    await prepareGoogle();
    return;
  }
  btnEl.disabled = true;
  showMsg("로그인 중…", "ok");
  try {
    const { data, error } = await supa.auth.signInWithIdToken({ provider: "google", token: credential, nonce: googleNonce });
    const token = data && data.session && data.session.access_token;
    if (error || !token) {
      showMsg(googleErrorText(error || "no session"), "error");
      btnEl.disabled = false;
      await prepareGoogle();                // 번호표는 한 번만 쓴다 — 다시 누를 수 있게 새로 만든다
      return;
    }
    sessionStorage.setItem(TOKEN_KEY, token);
    location.replace(NEXT);
  } catch (err) {
    showMsg(googleErrorText(err), "error");
    btnEl.disabled = false;
    try { await prepareGoogle(); } catch (e) {}
  }
}

// 2) 폼 제출 = 로그인 시도.
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!supa) { showMsg("로그인 준비 중입니다. 잠시 후 다시 시도해 주세요.", "error"); return; }
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  btnEl.disabled = true;
  showMsg("로그인 중…", "ok");
  try {
    const { data, error } = await supa.auth.signInWithPassword({ email, password });
    if (error) {
      showMsg("이메일 또는 비밀번호가 올바르지 않습니다.", "error");
      btnEl.disabled = false;
      return;
    }
    const token = data && data.session && data.session.access_token;
    if (!token) {
      showMsg("로그인에 성공했지만 토큰을 받지 못했습니다. 다시 시도해 주세요.", "error");
      btnEl.disabled = false;
      return;
    }
    // 3) 출입증(토큰) 저장 후 작업 화면으로.
    sessionStorage.setItem(TOKEN_KEY, token);
    location.replace(NEXT);
  } catch (err) {
    showMsg("로그인 중 문제가 발생했습니다: " + err, "error");
    btnEl.disabled = false;
  }
});

init();
</script>
</body>
</html>
