<!-- @dsCard group="grader · 패턴 의뢰" viewport="390x844" name="패턴 의뢰 작성 (폰)" subtitle="실물 옷 사진·치수·구조를 현장에서 모아 올린다 — 옷 고르기 → 기본 정보 → 사진 → 치수 → 구조·제출" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>STIZ grader · 패턴 의뢰</title>
<link rel="icon" href="../assets/logos/stiz-favicon-32.png" />
<!-- 앱 설치(PWA) — 홈 화면에 «패턴 의뢰» 아이콘으로 깔린다. 껍데기 저장은 intake-sw.js -->
<link rel="manifest" href="intake.webmanifest" />
<meta name="theme-color" content="#ffffff" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="패턴 의뢰" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="apple-touch-icon" href="intake-icons/apple-touch-icon-180.png" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-25..0" />
<link rel="stylesheet" href="app.css" />
<style>
  /* ===== 패턴 의뢰 — 폰 우선 화면 =====
     현장 직원이 한 손으로 쓴다: 큰 누름 칸, 위 막대(제목·저장 상태), 단계 띠, 아래 이전/다음.
     색은 그레이더 디자인 토큰(var(--*))만 쓴다. app.css 의 .row 등과 겹치지 않게 ik- 를 붙인다. */
  html, body { background: var(--surface-canvas); }
  body.ik-lock { overflow: hidden; }
  .ik-wrap { max-width: 640px; margin: 0 auto; }

  .ik-bar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 6px;
    min-height: 56px; padding: env(safe-area-inset-top, 0px) max(12px, env(safe-area-inset-right, 0px)) 0 max(6px, env(safe-area-inset-left, 0px));
    background: var(--surface-card); border-bottom: 1px solid var(--border-subtle); }
  .ik-bar__back { width: 44px; height: 44px; border: 0; background: none; border-radius: var(--radius-md); cursor: pointer; color: var(--text-strong); display: grid; place-items: center; }
  .ik-bar__back:hover { background: var(--surface-hover); }
  .ik-bar__title { flex: 1; min-width: 0; }
  .ik-bar__title b { display: block; font: var(--text-h3); color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ik-bar__title small { display: block; font: var(--text-caption); color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ik-save { flex: none; font: var(--text-caption); color: var(--text-muted); display: flex; align-items: center; gap: 4px; border: 0; background: none; padding: 6px; border-radius: var(--radius-sm); }
  .ik-save .material-symbols-outlined { font-size: 16px; }
  .ik-save.is-error { color: var(--red-700); cursor: pointer; font-weight: 600; }
  .ik-practice { background: var(--amber-bg); color: var(--amber-700); font: var(--text-sm-strong); text-align: center; padding: 6px 12px; border-bottom: 1px solid var(--amber-border); }
  .ik-ro { background: var(--blue-bg); color: var(--blue-700); font: var(--text-sm-strong); text-align: center; padding: 8px 12px; }

  .ik-main { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 120px max(16px, env(safe-area-inset-left, 0px)); }
  .ik-h2 { font: var(--text-h2); color: var(--text-strong); margin: 0 0 12px; }
  .ik-h3 { font: var(--text-h3); color: var(--text-strong); margin: 22px 0 10px; }
  .ik-muted { color: var(--text-muted); font: var(--text-sm); }

  /* 목록 */
  .ik-new { width: 100%; height: 56px; font-size: 17px; }
  .ik-cards { display: grid; gap: 10px; margin-top: 18px; }
  .ik-card { display: grid; gap: 10px; padding: 14px 16px; border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg); background: var(--surface-card); }
  .ik-card:hover { border-color: var(--border-strong); }
  .ik-card__open { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 0; border: 0; background: none; cursor: pointer; font: var(--text-body); color: var(--text-body); }
  .ik-card__open:disabled { cursor: default; color: inherit; }
  .ik-card__body { flex: 1; min-width: 0; display: grid; gap: 4px; }
  /* 고르기 — 작성 중인 것만 고를 수 있다 */
  .ik-listhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 22px; }
  .ik-listhead .ik-h3 { margin: 0; }
  .ik-listhead + .ik-cards { margin-top: 10px; }
  .ik-card__box { flex: none; font-size: 26px; color: var(--text-subtle); }
  .ik-card.is-on { border-color: var(--text-strong); }
  .ik-card.is-on .ik-card__box { color: var(--text-strong); }
  .ik-card.is-off { opacity: .45; }
  .ik-selask { grid-column: 1 / -1; margin: 0; font: var(--text-sm-strong); color: var(--red-700); }
  /* 목록 탭 — 내 의뢰 / 전체 / 휴지통(관리자만) */
  .ik-tabs { display: flex; gap: 4px; margin-top: 22px; padding: 4px; border-radius: var(--radius-md); background: var(--ink-100); }
  .ik-tab { flex: 1; height: 40px; border: 0; border-radius: var(--radius-sm); background: none; font: var(--text-sm-strong); color: var(--text-muted); cursor: pointer; }
  .ik-tab[aria-selected="true"] { background: var(--surface-card); color: var(--text-strong); box-shadow: var(--shadow-sm, 0 1px 2px rgba(14, 17, 20, .08)); }
  .ik-tabs + .ik-listhead { margin-top: 14px; }
  .ik-card__who { color: var(--text-muted); }
  .ik-card__acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ik-card__acts .btn { height: 42px; }
  .ik-card__ask { grid-column: 1 / -1; margin: 0; font: var(--text-sm-strong); color: var(--red-700); }
  /* 앱 설치 안내 · 연결 없음 */
  .ik-install { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 10px 6px 10px 12px; border-radius: var(--radius-md); background: var(--surface-card); border: 1px solid var(--border-subtle); font: var(--text-sm); color: var(--text-body); }
  .ik-install p { flex: 1; margin: 0; }
  .ik-install .ik-bar__back { width: 36px; height: 36px; flex: none; }
  .ik-offline { background: var(--red-bg); color: var(--red-700); font: var(--text-sm-strong); text-align: center; padding: 6px 12px; }
  .ik-newform { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); background: var(--surface-card); }
  .ik-newform label { font: var(--text-sm-strong); color: var(--text-body); }
  .ik-newform .input { font-size: 16px; height: 46px; }
  .ik-bar__title.is-link { cursor: pointer; }
  .ik-bar__edit { font-size: 16px; margin-left: 4px; color: var(--text-subtle); vertical-align: -2px; }
  .ik-card__top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .ik-card__code { font: var(--text-sm-strong); color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .ik-card__name { font: var(--text-body-strong); color: var(--text-strong); }
  .ik-card__meta { font: var(--text-caption); color: var(--text-subtle); font-variant-numeric: tabular-nums; }
  .ik-status { font: 600 12px/1 var(--font-sans); padding: 5px 8px; border-radius: var(--radius-pill); white-space: nowrap; }
  .ik-status--draft { background: var(--ink-100); color: var(--ink-700); }
  .ik-status--submitted { background: var(--blue-bg); color: var(--blue-700); }
  .ik-status--reviewed { background: var(--green-bg); color: var(--green-700); }
  .ik-pat { margin-left: 6px; background: var(--green-bg); color: var(--green-700); }
  .ik-pat--error { background: var(--ink-100); color: var(--red-700); }
  .ik-build { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--ink-100); }
  .ik-build__err { color: var(--red-700); font: var(--text-sm); margin: 4px 0 8px; }
  .ik-build__md { white-space: pre-wrap; font: var(--text-sm); background: var(--ink-100); border-radius: 8px; padding: 10px; margin: 8px 0 0; max-height: 60vh; overflow: auto; }

  /* 단계 띠 */
  .ik-steps { position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); z-index: 20; display: flex; gap: 6px; overflow-x: auto;
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
    background: var(--surface-canvas); border-bottom: 1px solid var(--border-subtle); scrollbar-width: none; }
  .ik-steps::-webkit-scrollbar { display: none; }
  .ik-step { flex: none; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: var(--radius-pill);
    border: 1px solid var(--border-default); background: var(--surface-card); font: var(--text-sm-strong); color: var(--text-body); cursor: pointer; white-space: nowrap; }
  .ik-step em { font-style: normal; font-weight: 500; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .ik-step[aria-current="step"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .ik-step[aria-current="step"] em { color: var(--ink-300); }
  .ik-step.is-done:not([aria-current="step"]) { border-color: var(--green-border); }

  /* 아래 이전/다음 */
  .ik-foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface-card); border-top: 1px solid var(--border-subtle);
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .ik-foot__in { max-width: 608px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; }
  .ik-foot .btn { height: 50px; font-size: 16px; }

  /* 고르기 칩 */
  .ik-group { margin-top: 18px; }
  .ik-group__name { font: var(--text-sm-strong); color: var(--text-muted); margin-bottom: 8px; }
  .ik-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .ik-chip { min-height: 42px; padding: 0 14px; border-radius: var(--radius-pill); border: 1px solid var(--border-default); background: var(--surface-card);
    font: 500 15px/1.2 var(--font-sans); color: var(--text-body); cursor: pointer; }
  .ik-chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .ik-chip:disabled { cursor: not-allowed; color: var(--text-subtle); background: transparent; border-style: dashed; }
  .ik-chip small { font-size: 12px; margin-left: 4px; }
  .ik-hint { font: var(--text-caption); color: var(--text-muted); margin-top: 6px; }
  /* 사진으로 옷 모양 맞추기 (AI) */
  .ik-ai { margin: 0 0 6px; padding: 14px; border-radius: var(--radius-lg); background: var(--surface-card); border: 1px solid var(--blue-border); display: grid; gap: 10px; }
  .ik-ai__head { display: flex; align-items: center; gap: 6px; font: var(--text-h3); color: var(--text-strong); }
  .ik-ai__head .material-symbols-outlined { color: var(--blue-600); font-size: 20px; }
  .ik-ai__rule { margin: 0; padding: 8px 10px; border-radius: var(--radius-md); background: var(--amber-bg); color: var(--amber-700); font: var(--text-sm); }
  .ik-ai__rule b { color: var(--text-strong); }
  .ik-ai__shots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ik-ai__shot { display: grid; gap: 6px; min-width: 0; }
  .ik-ai__ph { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: var(--radius-md); background: var(--ink-50); display: grid; place-items: center; overflow: hidden; }
  .ik-ai__ph--empty .dg { width: 100%; height: 100%; }
  .ik-ai__lbl { font: var(--text-sm-strong); color: var(--text-body); text-align: center; }
  .ik-ai__btns { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
  .ik-ai__btns .btn { height: 40px; }
  .ik-ai__msg { font: var(--text-sm); color: var(--text-body); background: var(--ink-50); border-radius: var(--radius-md); padding: 10px 12px; }
  .ik-ai__spin { width: 14px; height: 14px; border-color: var(--ink-500); border-top-color: var(--paper); }
  .ik-aitag { display: inline-block; margin-left: 6px; padding: 2px 5px; border-radius: 4px; font: 700 10px/1.2 var(--font-sans); background: var(--blue-600); color: var(--paper); vertical-align: 1px; }
  .ik-group.is-check { padding: 10px 12px; margin-left: -12px; margin-right: -12px; border-radius: var(--radius-md); background: var(--amber-bg); border: 1px solid var(--amber-border); }
  .ik-check-note { font: var(--text-sm-strong); color: var(--amber-700); margin-top: 8px; }
  .ik-garment { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ik-garment figure { margin: 0; background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 4px; }
  .ik-garment figcaption { text-align: center; font: var(--text-caption); color: var(--text-muted); padding-bottom: 4px; }
  .ik-count { display: flex; gap: 16px; margin-top: 18px; padding: 12px 14px; border-radius: var(--radius-md); background: var(--surface-card); border: 1px solid var(--border-subtle); font: var(--text-sm); color: var(--text-muted); }
  .ik-count b { font: 700 18px/1 var(--font-sans); color: var(--text-strong); margin-right: 3px; font-variant-numeric: tabular-nums; }

  /* 입력 — 폰에서 확대되지 않게 16px */
  .ik-field { display: grid; gap: 6px; margin-bottom: 16px; }
  .ik-field label { font: var(--text-sm-strong); color: var(--text-body); }
  .ik-main .input, .ik-sheet .input { font-size: 16px; height: 46px; }
  .ik-field textarea.input { height: auto; min-height: 92px; padding: 10px 12px; line-height: 1.5; resize: vertical; }
  .ik-req { color: var(--red-600); }
  .ik-danger { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--border-subtle); }
  .ik-linkbtn { border: 0; background: none; color: var(--red-700); font: var(--text-sm-strong); padding: 8px 0; cursor: pointer; }

  /* 규칙 상자 */
  .ik-rules { margin: 0 0 14px; padding: 10px 14px 10px 30px; background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); font: var(--text-sm); color: var(--text-body); }
  .ik-rules li + li { margin-top: 2px; }

  /* 칸 목록 */
  .ik-items { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .ik-pose { display: flex; align-items: center; gap: 6px; margin-top: 10px; font: var(--text-sm-strong); color: var(--text-strong); }   /* 사진 — 옷을 놓는 자세가 바뀌는 자리 */
  .ik-pose:first-child { margin-top: 0; }
  .ik-pose .material-symbols-outlined { font-size: 18px; color: var(--text-muted); }
  .ik-item { width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 64px;
    padding: 10px 12px; text-align: left; border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); background: var(--surface-card); cursor: pointer; font: var(--text-body); color: var(--text-body); }
  .ik-item:hover { border-color: var(--border-strong); }
  .ik-item__num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--font-sans); background: var(--ink-100); color: var(--ink-700); font-variant-numeric: tabular-nums; }
  .ik-item.is-done .ik-item__num { background: var(--green-600); color: var(--paper); }
  .ik-item.is-skip .ik-item__num { background: var(--amber-500); color: var(--paper); }
  .ik-item__main { min-width: 0; display: grid; gap: 2px; }
  .ik-item__main b { font: var(--text-body-strong); color: var(--text-strong); }
  .ik-item__main small { font: var(--text-caption); color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ik-item__state { font: var(--text-sm-strong); color: var(--text-muted); text-align: right; display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .ik-item__state img { width: 44px; height: 44px; object-fit: cover; border-radius: var(--radius-sm); background: var(--ink-100); }
  .ik-item.is-done .ik-item__state { color: var(--green-700); }
  .ik-item.is-skip .ik-item__state { color: var(--amber-700); }

  /* 구조 질문 · 조각 */
  .ik-q { padding: 14px; border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); background: var(--surface-card); display: grid; gap: 10px; }
  .ik-q + .ik-q { margin-top: 10px; }
  .ik-q__title { font: var(--text-body-strong); color: var(--text-strong); display: flex; gap: 8px; }
  .ik-q__title span { color: var(--text-subtle); font-variant-numeric: tabular-nums; }
  .ik-q.is-missing { border-color: var(--red-border); }
  .ik-extra { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; padding: 14px; border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); background: var(--surface-card); margin-bottom: 10px; }
  .ik-extra .ik-field { margin: 0; }
  .ik-extra .ik-full { grid-column: 1 / -1; }

  /* 제출 */
  .ik-submit { margin-top: 26px; padding: 16px; border-radius: var(--radius-lg); border: 1px solid var(--border-subtle); background: var(--surface-card); display: grid; gap: 12px; }
  .ik-missing { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .ik-missing button { width: 100%; text-align: left; border: 1px solid var(--red-border); background: var(--red-bg); color: var(--red-700); border-radius: var(--radius-md); padding: 10px 12px; font: var(--text-sm-strong); cursor: pointer; }
  .ik-ok { color: var(--green-700); font: var(--text-body-strong); }

  /* 가이드 시트 */
  .ik-sheet { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; background: rgba(14, 17, 20, .45); }
  .ik-sheet__panel { width: 100%; max-width: 640px; max-height: 100%; display: flex; flex-direction: column; background: var(--surface-canvas);
    border-radius: 16px 16px 0 0; box-shadow: var(--shadow-overlay); padding-top: env(safe-area-inset-top, 0px); }
  .ik-sheet__head { display: flex; align-items: center; gap: 8px; padding: 12px 8px 10px 16px; border-bottom: 1px solid var(--border-subtle); background: var(--surface-card); border-radius: 16px 16px 0 0; }
  .ik-sheet__head h2 { flex: 1; min-width: 0; margin: 0; font: var(--text-h3); color: var(--text-strong); }
  .ik-sheet__head .ik-num { font: var(--text-sm-strong); color: var(--text-subtle); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ik-sheet__body { overflow-y: auto; padding: 14px 16px 20px; display: grid; gap: 14px; overscroll-behavior: contain; }
  .ik-sheet__foot { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--border-subtle); background: var(--surface-card); }
  .ik-sheet__foot .btn { height: 48px; }
  .ik-fig { display: grid; gap: 8px; }
  .ik-fig.is-two { grid-template-columns: 1fr 1fr; }
  .ik-fig .dg { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); max-height: 46vh; }
  .ik-mode { display: inline-block; font: 600 12px/1 var(--font-sans); padding: 5px 8px; border-radius: var(--radius-sm); background: var(--ink-100); color: var(--ink-700); }
  .ik-guide { margin: 0; display: grid; grid-template-columns: 4.6em minmax(0, 1fr); gap: 6px 10px; font: var(--text-body); }
  .ik-guide dt { color: var(--text-subtle); font: var(--text-sm-strong); padding-top: 2px; }
  .ik-guide dd { margin: 0; color: var(--text-body); }
  .ik-guide dd.is-warn { color: var(--red-700); }
  .ik-ex { display: flex; gap: 8px; overflow-x: auto; }
  .ik-ex figure { margin: 0; flex: none; width: 140px; position: relative; }
  .ik-ex img { width: 140px; height: 140px; object-fit: cover; border-radius: var(--radius-md); display: block; }
  .ik-ex svg { position: absolute; left: 0; top: 0; width: 140px; height: 140px; }
  .ik-ex line { stroke: var(--stiz-red); stroke-width: 3; vector-effect: non-scaling-stroke; }
  .ik-ex figcaption { font: var(--text-caption); color: var(--text-muted); margin-top: 4px; }

  .ik-photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ik-ph { position: relative; aspect-ratio: 1; border-radius: var(--radius-md); overflow: hidden; background: var(--ink-100); margin: 0; }
  .ik-ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ik-ph__del { position: absolute; top: 4px; right: 4px; min-width: 32px; height: 32px; padding: 0 8px; border-radius: var(--radius-pill); border: 0;
    background: rgba(14, 17, 20, .62); color: var(--paper); font: var(--text-sm-strong); cursor: pointer; display: grid; place-items: center; }
  .ik-ph__del.is-armed { background: var(--red-600); }

<!-- Supabase JS SDK(CDN) — 다른 화면과 같은 주소. 빌드 0 원칙. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../intake/diagram.js?v=2026-10-19"></script>
<script>
/* ============================================================
   패턴 의뢰 작성 화면 — 동작 개요
   · 저장소 두 가지
       실제: Supabase 표 pattern_intakes + 비공개 사진 창고 pattern-intake (로그인한 직원 권한으로)
       연습: 로그인이 없는 로컬(인증 꺼짐)에서만 — 이 브라우저(localStorage·IndexedDB)에만 저장
   · 칸 목록은 목록 파일(../intake/catalog.json)을 diagram.js 의 resolve 로 풀어 만든다
   · 고칠 때마다 0.7초 뒤 자동 저장, 사진은 올리자마자 저장
   · 비밀키는 쓰지 않는다 — 공개키 + 로그인 토큰만 (권한은 DB 규칙이 지킨다)
   ============================================================ */
const K = window.PatternIntake;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const STEPS = ["옷 고르기", "기본 정보", "사진", "치수", "구조·제출"];
const STATUS = { draft: "작성 중", submitted: "제출", reviewed: "검토 완료" };
const MAX_PHOTOS = 3;

let CAT = null, BASE = null, store = null;
let VISION = false;                                     // 서버에 AI 키가 있으면 «사진으로 맞추기» 카드를 보인다
let cur = null, D = null, R = null;     // 지금 의뢰 · 그 data · 풀린 칸 목록
let step = 1, readOnly = false;

/* ---------- 저장소: 실제(Supabase) ---------- */
function RealStore(supa, user) {
  const T = () => supa.from("pattern_intakes");
  const B = () => supa.storage.from("pattern-intake");
  const urls = new Map();
  // 행 하나를 «0줄이면 실패» 로 고친다 — 권한이 없으면 오류 대신 0줄이 오기 때문
  const one = async (q) => {
    const { data, error } = await q.select("id");
    if (error) throw error;
    if (!data || !data.length) throw new Error("NOEDIT");
  };
  return {
    mode: "real",
    userId: user.id,
    // 관리자 판정 — DB 의 intake_is_admin() 과 같은 기준(app_metadata.role). 화면 표시용일 뿐, 최종 판정은 DB 규칙이다
    isAdmin: ((user.app_metadata || {}).role) === "admin",
    // tab: mine = 내 것(휴지통 빼고) · all = 모든 직원 것(휴지통 빼고) · trash = 휴지통
    async list(tab) {
      let q = T().select("id,code,product_name,size_label,status,updated_at,created_by,created_by_email,deleted_at,bstat:data->build->>status,bver:data->build->>ver");
      if (tab === "trash") q = q.not("deleted_at", "is", null).order("deleted_at", { ascending: false });
      else {
        q = q.is("deleted_at", null).order("updated_at", { ascending: false });
        if (tab !== "all") q = q.eq("created_by", user.id);
      }
      const { data, error } = await q.limit(tab === "mine" ? 50 : 200);
      if (error) throw error;
      return data;
    },
    async create(fields) {
      const { data, error } = await T().insert(fields).select().single();
      if (error) throw error;
      return data;
    },
    async get(id) {
      const { data, error } = await T().select("*").eq("id", id).single();
      if (error) throw error;
      return data;
    },
    async update(id, patch, since) {
      // since = 마지막으로 읽은 고친 시각. 그사이 다른 곳에서 고쳤으면 0줄 → single() 이 오류(PGRST116)
      // 고칠 권한이 없을 때(검토 완료·남의 의뢰)도 같은 0줄이다 — 부르는 쪽이 다시 읽어 가른다
      let q = T().update(patch).eq("id", id);
      if (since) q = q.eq("updated_at", since);
      const { data, error } = await q.select("id,status,updated_at,submitted_at").single();
      if (error) throw error;
      return data;
    },
    // 휴지통으로 — 행·사진은 그대로 두고 deleted_at 만 채운다(시각·누가는 DB 트리거가 적는다).
    // 직원은 «내 작성 중» 만 된다 — 다른 기기에서 그사이 제출했을 수 있어 다시 읽어 확인한다
    async trash(id) {
      if (!this.isAdmin) {
        const { data: row, error: e0 } = await T().select("status,created_by,deleted_at").eq("id", id).single();
        if (e0) throw e0;
        if (row.status !== "draft" || row.created_by !== user.id || row.deleted_at) throw new Error("NOEDIT");
      }
      await one(T().update({ deleted_at: new Date().toISOString() }).eq("id", id).is("deleted_at", null));
    },
    async restore(id) {                                 // 되살리기 — 관리자만(DB 가 막는다)
      await one(T().update({ deleted_at: null }).eq("id", id).not("deleted_at", "is", null));
    },
    // 완전 삭제 — 관리자만, 휴지통에 든 것만. 사진 창고 규칙이 «행이 있을 때» 판정하므로 사진부터 지우고 행을 지운다
    async purge(id) {
      const { data: row, error: e0 } = await T().select("deleted_at").eq("id", id).single();
      if (e0) throw e0;
      if (!row.deleted_at) throw new Error("NOEDIT");   // 휴지통을 거치지 않은 것은 지우지 않는다
      // 목록은 한 번에 1000개까지라 «빌 때까지» 읽고 지우기를 되풀이한다 (넘치면 남은 사진이 주인 없이 남는다)
      for (let round = 0; round < 100; round++) {
        const { data: files, error: e1 } = await B().list("intakes/" + id, { limit: 1000 });
        if (e1) throw e1;
        const real = (files || []).filter((f) => f.id); // id 없는 것은 하위 폴더 표시 — 파일만
        if (!real.length) break;
        if (round === 99) throw new Error("사진이 너무 많아 다 지우지 못했어요. 다시 눌러 주세요.");
        const paths = real.map((f) => "intakes/" + id + "/" + f.name);
        const { data: gone, error: e2 } = await B().remove(paths);
        if (e2) throw e2;
        // 권한이 없으면 오류 없이 덜 지워진다 — 사진이 남았는데 행을 지우면 주인 없는 파일이 된다
        if (!gone || gone.length < paths.length) throw new Error("NOEDIT");
      }
      // 휴지통에 든 것만 — DB 규칙(관리자 + deleted_at 있음)과 이중으로 막는다
      await one(T().delete().eq("id", id).not("deleted_at", "is", null));
    },
    async refresh() {
      try { const { data, error } = await supa.auth.refreshSession(); return !error && !!(data && data.session); } catch (e) { return false; }
    },
    async token() {                                     // 그레이더 서버(/api)에 보낼 로그인 토큰
      try { const { data } = await supa.auth.getSession(); return (data && data.session && data.session.access_token) || ""; } catch (e) { return ""; }
    },
    async upload(path, blob) {
      const { error } = await B().upload(path, blob, { contentType: "image/jpeg", upsert: false });
      if (error) throw error;
    },
    async removeFile(path) { await B().remove([path]); },
    async url(path) {                                   // 비공개 창고 — 1시간짜리 열람 주소
      const hit = urls.get(path);
      if (hit && hit.until > Date.now()) return hit.url;
      const { data, error } = await B().createSignedUrl(path, 3600);
      if (error) throw error;
      urls.set(path, { url: data.signedUrl, until: Date.now() + 50 * 60 * 1000 });
      return data.signedUrl;
    },
    async examples(itemKey) {
      const { data, error } = await supa.from("intake_examples").select("storage_path,line,caption").eq("item_key", itemKey).order("sort").limit(4);
      return error ? [] : data;
    },
  };
}

/* ---------- 저장소: 연습(이 브라우저) ---------- */
function idb() {
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open("grader-intake-practice", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("files");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction("files", mode);
      const req = fn(t.objectStore("files"));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error("브라우저 저장 공간이 부족해요"));
    });
  };
  return {
    put: (k, v) => run("readwrite", (s) => s.put(v, k)),
    get: (k) => run("readonly", (s) => s.get(k)),
    del: (k) => run("readwrite", (s) => s.delete(k)),
    keys: () => run("readonly", (s) => s.getAllKeys()),
  };
}
function PracticeStore() {
  const KEY = "grader-intake-practice-v1";
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { return []; } };
  const save = (rows) => localStorage.setItem(KEY, JSON.stringify(rows));
  const files = idb(), urls = new Map();
  const now = () => new Date().toISOString();
  return {
    mode: "practice",
    userId: "practice",
    // 연습 모드는 혼자 쓰는 로컬이라 관리자 화면을 기본으로 보인다. 직원 화면을 시험하려면 주소에 ?practice_role=staff
    isAdmin: new URLSearchParams(location.search).get("practice_role") !== "staff",
    async refresh() { return true; },
    async token() { return ""; },
    async list(tab) {                                   // 실제 저장소와 같은 갈래 — 연습 의뢰는 전부 «내 것»
      const rows = load().filter((r) => (tab === "trash") === !!r.deleted_at);
      const k = tab === "trash" ? "deleted_at" : "updated_at";
      return rows.sort((a, b) => (a[k] < b[k] ? 1 : -1));
    },
    async create(fields) {
      const rows = load();
      const d = new Date(), ymd = String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
      const n = rows.filter((r) => r.code.startsWith("연습-" + ymd)).length + 1;
      const row = Object.assign({ id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())), code: "연습-" + ymd + "-" + String(n).padStart(3, "0"),
        product_name: "", size_label: "", ref_url: "", note: "", status: "draft", data: {}, created_by: "practice", created_at: now(), updated_at: now() }, fields);
      rows.push(row); save(rows);
      return row;
    },
    async get(id) {
      const r = load().find((x) => x.id === id);
      if (!r) throw new Error("의뢰를 찾지 못했어요");
      return r;
    },
    async update(id, patch) {                           // 한 브라우저 안이라 «그사이 고침» 확인은 하지 않는다
      const rows = load(), r = rows.find((x) => x.id === id);
      if (!r) throw new Error("의뢰를 찾지 못했어요");
      if (patch.status === "submitted" && r.status !== "submitted") r.submitted_at = now();
      Object.assign(r, patch, { updated_at: now() });
      save(rows);
      return { id, status: r.status, updated_at: r.updated_at, submitted_at: r.submitted_at };
    },
    // 휴지통 · 되살리기 · 완전 삭제 — 실제 저장소(DB 규칙)와 같은 조건을 여기서 흉내 낸다
    async trash(id) {
      const rows = load(), r = rows.find((x) => x.id === id);
      if (!r || r.deleted_at || (!this.isAdmin && r.status !== "draft")) throw new Error("NOEDIT");
      r.deleted_at = now(); r.deleted_by = "practice"; save(rows);
    },
    async restore(id) {
      const rows = load(), r = rows.find((x) => x.id === id);
      if (!r || !r.deleted_at || !this.isAdmin) throw new Error("NOEDIT");
      r.deleted_at = null; r.deleted_by = null; save(rows);
    },
    async purge(id) {
      const r = load().find((x) => x.id === id);
      if (!r || !r.deleted_at || !this.isAdmin) throw new Error("NOEDIT");
      for (const k of await files.keys()) if (String(k).startsWith("intakes/" + id + "/")) await files.del(k);
      save(load().filter((x) => x.id !== id));
    },
    async upload(path, blob) { await files.put(path, blob); },
    async removeFile(path) { await files.del(path); },
    async url(path) {
      if (urls.has(path)) return urls.get(path);
      const b = await files.get(path);
      if (!b) throw new Error("사진을 찾지 못했어요");
      const u = URL.createObjectURL(b);
      urls.set(path, u);
      return u;
    },
    async examples() { return []; },
  };
}

/* ---------- 작은 도우미 ---------- */
let toastTimer = null;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg; el.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add("hidden"), 3200);
}
function errText(e) {
  const m = (e && (e.message || e.error_description || e.error)) || String(e || "");
  if (isNoRow(e) || m === "NOEDIT") return "이 의뢰는 지금 고칠 수 없어요 (검토 완료·휴지통이거나 내 의뢰가 아니에요)";
  if (/INTAKE_TRASHED/.test(m)) return "휴지통에 있는 의뢰라 관리자만 고치거나 되살릴 수 있어요";
  if (/INTAKE_TRASH_DENIED/.test(m)) return "내가 작성 중인 의뢰만 휴지통으로 옮길 수 있어요";
  if (/INTAKE_STATUS_BACK/.test(m)) return "제출한 의뢰를 작성 중으로 되돌릴 수 없어요";
  if (/JWT|token|401|expired/i.test(m)) return "로그인이 끝났어요. 다시 로그인해 주세요.";
  if (/Failed to fetch|NetworkError|network/i.test(m)) return "인터넷 연결을 확인해 주세요.";
  return m;
}
function when(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
const tokensOf = (sel) => Array.from(K.tokens(sel));
const isNoRow = (e) => !!e && (e.code === "PGRST116" || /0 rows|no\) rows/i.test(e.message || ""));
// 고칠 수 있는 의뢰인가 — 휴지통 아님 + 검토 완료 전 + (실제 저장소면) 내가 만든 것
// (남의 의뢰는 «전체» 탭에서 열어도 읽기 전용 — 고치기·사진 추가·지우기 단추가 안 나온다)
const canEdit = (row) => !row.deleted_at && row.status !== "reviewed" && (store.mode !== "real" || row.created_by === store.userId);
function normData(d) {
  const out = Object.assign({ sel: null, photos: {}, skipped: {}, measures: {}, answers: {}, extras: [] }, d || {});
  out.sel = Object.assign(K.defaults(BASE), out.sel || {}, { base: BASE.key });
  return out;
}

/* ---------- 시작 ---------- */
async function init() {
  const st = document.createElement("style"); st.textContent = K.CSS; document.head.appendChild(st);
  try {
    CAT = await (await fetch("../intake/catalog.json", { cache: "no-cache" })).json();
  } catch (e) {
    $("#main").innerHTML = '<p class="ik-empty">목록 파일을 읽지 못했어요. 새로고침해 주세요.</p>';
    return;
  }
  // 공개 설정을 못 읽으면 멈춘다 — 짐작으로 연습 모드에 들어가면 운영에서도 그 폰에만 저장된다
  let cfg = null;
  try { const r = await fetch("/api/public-config"); if (r.ok) cfg = await r.json(); } catch (e) {}
  if (!cfg) {
    $("#main").innerHTML = '<p class="ik-empty">' + (navigator.onLine === false ? "연결 없음 — 인터넷이 연결되면 새로고침해 주세요." : "서버에 연결하지 못했어요. 새로고침해 주세요.") + "</p>";
    return;
  }
  VISION = !!cfg.intake_vision;
  if (cfg.supabase_url && cfg.supabase_publishable_key && window.supabase) {
    const supa = window.supabase.createClient(cfg.supabase_url, cfg.supabase_publishable_key);
    try {
      const { data } = await supa.auth.getSession();
      const s = data && data.session;
      if (s) store = RealStore(supa, s.user);
    } catch (e) {}
  }
  if (!store) {
    if (cfg.auth_required !== false) { location.replace("/static/screens/login.html?next=intake.html"); return; }
    store = PracticeStore();
    $("#practiceNote").classList.remove("hidden");
  }
  const q = new URLSearchParams(location.search);
  if (q.get("id")) openIntake(q.get("id"), Math.min(5, Math.max(1, parseInt(q.get("step"), 10) || 1)));
  else showList();
}

/* ---------- 목록 ---------- */
const NEW_BTN = '<button class="btn btn--primary ik-new" type="button" id="newBtn"><span class="material-symbols-outlined">add</span>새 의뢰 시작</button>';
async function showList() {
  cur = null;
  $("#backBtn").classList.add("hidden");
  $("#steps").classList.add("hidden");
  $("#foot").classList.add("hidden");
  $("#roNote").classList.add("hidden");
  $("#barTitle").textContent = "패턴 의뢰";
  $("#barSub").textContent = "실물 옷 사진·치수 모으기";
  $("#barEdit").classList.add("hidden");
  $("#barTitleBox").classList.remove("is-link");
  setSave("");
  if (listTab === "trash" && !store.isAdmin) listTab = "all";    // 휴지통은 관리자만
  const tabs = [["mine", "내 의뢰"], ["all", "전체"]].concat(store.isAdmin ? [["trash", "휴지통"]] : []);
  $("#main").innerHTML = '<div id="newBox">' + NEW_BTN + '</div><div id="installSlot"></div>' +
    '<div class="ik-tabs" role="tablist">' + tabs.map(([k, name]) =>
      '<button class="ik-tab" type="button" role="tab" data-tab="' + k + '" aria-selected="' + (k === listTab) + '">' + name + "</button>").join("") + "</div>" +
    '<div class="ik-listhead"><h2 class="ik-h3" id="listTitle"></h2><span id="selSlot"></span></div>' +
    '<div class="ik-cards" id="cards"></div><div id="selBar"></div>';
  renderInstall();
  loadList();
}
// 지금 탭의 목록을 다시 읽는다 — 탭을 바꿀 때마다
async function loadList() {
  listRows = []; selMode = false; selAsk = false; picked.clear(); purgeAsk = null;
  for (const t of document.querySelectorAll(".ik-tab")) t.setAttribute("aria-selected", String(t.dataset.tab === listTab));
  $("#listTitle").textContent = { mine: "내 의뢰", all: "전체 의뢰", trash: "휴지통" }[listTab];
  $("#selSlot").innerHTML = ""; $("#selBar").innerHTML = "";
  $("#cards").innerHTML = '<div class="ik-center"><div class="spinner"></div></div>';
  const tab = listTab;
  let rows;
  try { rows = await store.list(tab); }
  catch (e) { if (tab === listTab) $("#cards").innerHTML = '<p class="ik-empty">목록을 불러오지 못했어요 — ' + esc(errText(e)) + "</p>"; return; }
  if (tab !== listTab || cur) return;                   // 그사이 다른 탭을 눌렀으면 버린다
  listRows = rows;
  renderCards();
}

// 탭 — mine: 내 의뢰 · all: 모든 직원 의뢰 · trash: 휴지통(관리자만). 고른 탭은 이 탭(창)에 기억한다
//   처음엔 «전체» — 직원끼리 누가 어떤 옷을 진행 중인지 바로 보이게(2026-10-22 사장님). 남의 의뢰는 읽기 전용으로 열린다
let listTab = (() => { try { return sessionStorage.getItem("grader-intake-tab") || "all"; } catch (e) { return "all"; } })();
// 고르기 상태(관리자만) — selMode: 고르는 중 · picked: 고른 의뢰 id · selAsk: «정말 옮길까» 묻는 중
// purgeAsk: 휴지통에서 완전 삭제를 묻는 중인 카드 {id, n} — n=1 첫 확인, n=2 마지막 확인
let listRows = [], selMode = false, selAsk = false, purgeAsk = null;
const picked = new Set();
// 작성자 표시 — 나 / 이메일 앞부분
const whoOf = (r) => (r.created_by === store.userId ? "나" : String(r.created_by_email || "").split("@")[0] || "알 수 없음");
function renderCards() {
  const trashTab = listTab === "trash";
  // 여러 건 휴지통 보내기는 관리자만(직원은 열어서 한 건씩) — 휴지통 탭에서는 고르지 않는다
  const canPick = store.isAdmin && !trashTab;
  $("#selSlot").innerHTML = canPick && listRows.length && !selMode ? '<button class="btn btn--ghost btn--sm" type="button" id="selBtn">고르기</button>' : "";
  $("#cards").innerHTML = listRows.length ? listRows.map((r) => {
    const can = selMode && canPick, on = can && picked.has(r.id);
    const meta = trashTab ? "지운 때 " + when(r.deleted_at) + " · " + whoOf(r)
      : when(r.updated_at) + (listTab === "all" ? " · " + whoOf(r) : "");
    let acts = "";
    if (trashTab) {                                     // 휴지통 카드 — 되살리기 · 완전 삭제(두 번 묻는다)
      const ask = purgeAsk && purgeAsk.id === r.id ? purgeAsk.n : 0;
      acts = '<div class="ik-card__acts">' + (ask ?
        '<p class="ik-card__ask">' + (ask === 1 ? "완전히 지울까요? 사진도 함께 지워지고 되돌릴 수 없어요." : "정말 지워요? 마지막 확인이에요.") + "</p>" +
        '<button class="btn btn--secondary" type="button" data-purge-no="' + esc(r.id) + '">그만두기</button>' +
        '<button class="btn btn--danger" type="button" data-purge-yes="' + esc(r.id) + '">' + (ask === 1 ? "지우기" : "완전 삭제") + "</button>"
        : '<button class="btn btn--secondary" type="button" data-restore="' + esc(r.id) + '"><span class="material-symbols-outlined">restore_from_trash</span>되살리기</button>' +
          '<button class="btn btn--ghost" type="button" data-purge="' + esc(r.id) + '">완전 삭제</button>') + "</div>";
    }
    return '<div class="ik-card' + (selMode ? (can ? (on ? " is-on" : "") : " is-off") : "") + '" data-card="' + esc(r.id) + '">' +
      '<button class="ik-card__open" type="button" data-id="' + esc(r.id) + '"' + (selMode && !can ? " disabled" : "") + (can ? ' aria-pressed="' + on + '"' : "") + ">" +
      (can ? '<span class="material-symbols-outlined ik-card__box">' + (on ? "check_box" : "check_box_outline_blank") + "</span>" : "") +
      '<span class="ik-card__body">' +
      '<span class="ik-card__top"><span class="ik-card__code">' + esc(r.code) + '</span><span><span class="ik-status ik-status--' + esc(r.status) + '">' + esc(STATUS[r.status] || r.status) + "</span>" + patBadge(r) + "</span></span>" +
      '<span class="ik-card__name">' + esc(r.product_name || "(제품 이름 없음)") + (r.size_label ? " · " + esc(r.size_label) : "") + "</span>" +
      '<span class="ik-card__meta">' + esc(meta) + "</span></span></button>" + acts + "</div>";
  }).join("") : '<p class="ik-empty">' + (trashTab ? "휴지통이 비어 있어요." : listTab === "all" ? "의뢰가 없어요." : "아직 의뢰가 없어요.") + "</p>";
  renderSelBar();
}
// 카드의 패턴 표시 — 자동 제작 결과(data.build) 상태
function patBadge(r) {
  const t = { built: "패턴 완성", stored: "재단 패턴 v" + (r.bver || ""), error: "패턴 실패" }[r.bstat];
  return t ? '<span class="ik-status ik-pat' + (r.bstat === "error" ? " ik-pat--error" : "") + '">' + esc(t) + "</span>" : "";
}
// 아래 막대 — 고르는 중에만. «N개 휴지통으로» → 한 번 더 묻고 → 옮긴다
function renderSelBar() {
  const n = picked.size;
  $("#selBar").innerHTML = !selMode ? "" :
    '<div class="ik-foot"><div class="ik-foot__in">' +
    (selAsk ? '<p class="ik-selask">' + n + "개를 휴지통으로 옮겨요. 휴지통에서 되살릴 수 있어요.</p>" : "") +
    '<button class="btn btn--secondary" type="button" id="' + (selAsk ? "selNo" : "selCancel") + '">그만두기</button>' +
    '<button class="btn btn--danger" type="button" id="' + (selAsk ? "selYes" : "selDel") + '"' + (n ? "" : " disabled") + ">" + (n ? n + "개 휴지통으로" : "휴지통으로") + "</button></div></div>";
}
async function trashPicked(btn) {
  btn.disabled = true; $("#selNo").disabled = true;
  btn.innerHTML = '<span class="spinner ik-ai__spin"></span>옮기는 중';
  let ok = 0, fail = null;
  for (const id of [...picked]) {                      // 하나씩 — 하나가 실패해도 나머지는 옮긴다(실패한 것은 고른 채 남는다)
    try {
      await store.trash(id);
      ok++; picked.delete(id);
      listRows = listRows.filter((r) => r.id !== id);
    } catch (err) { fail = err; }
  }
  selAsk = false;
  if (!fail || !listRows.length) { selMode = false; picked.clear(); }
  renderCards();
  toast(!fail ? ok + "개를 휴지통으로 옮겼어요"
    : ok ? ok + "개 옮겼어요 — " + picked.size + "개는 못 옮겼어요: " + errText(fail)
    : "옮기지 못했어요 — " + errText(fail));
}
// 휴지통 카드 — 되살리기 / 완전 삭제
async function trashAction(btn, kind, id) {
  btn.disabled = true;
  try {
    if (kind === "restore") await store.restore(id); else await store.purge(id);
    listRows = listRows.filter((r) => r.id !== id);
    purgeAsk = null; renderCards();
    toast(kind === "restore" ? "되살렸어요" : "완전히 지웠어요");
  } catch (err) {
    btn.disabled = false;
    toast((kind === "restore" ? "되살리지 못했어요 — " : "지우지 못했어요 — ") + errText(err));
  }
}

// 목록 화면 동작 — 새 의뢰(이름부터 받기)·탭·열기·고르기·휴지통
$("#main").addEventListener("click", async (e) => {
  if (cur) return;                                     // 의뢰를 연 화면에서는 아래 단계 화면 동작이 맡는다
  const b = e.target.closest("button");
  if (!b) return;
  if (b.id === "newBtn") {
    $("#newBox").innerHTML = '<div class="ik-newform"><label for="newName">제품 이름</label>' +
      '<input class="input" id="newName" autocomplete="off" enterkeyhint="done" placeholder="예: 레이지비 럭비 저지">' +
      '<div class="ik-addrow"><button class="btn btn--secondary" type="button" id="newCancel">그만두기</button>' +
      '<button class="btn btn--primary" type="button" id="newGo" disabled>만들기</button></div></div>';
    $("#newName").focus();
    return;
  }
  if (b.id === "newCancel") { $("#newBox").innerHTML = NEW_BTN; return; }
  if (b.id === "newGo") { newIntake(); return; }
  if (b.id === "installGo") { installApp(); return; }
  if (b.id === "installClose") { closeInstall(); return; }
  if (b.dataset.tab) {
    if (b.dataset.tab === listTab) return;
    listTab = b.dataset.tab;
    try { sessionStorage.setItem("grader-intake-tab", listTab); } catch (err) {}
    loadList();
    return;
  }
  if (b.dataset.restore) { trashAction(b, "restore", b.dataset.restore); return; }
  if (b.dataset.purge) { purgeAsk = { id: b.dataset.purge, n: 1 }; renderCards(); return; }
  if (b.dataset.purgeNo) { purgeAsk = null; renderCards(); return; }
  if (b.dataset.purgeYes) {
    if (purgeAsk && purgeAsk.id === b.dataset.purgeYes && purgeAsk.n === 1) { purgeAsk.n = 2; renderCards(); return; }
    trashAction(b, "purge", b.dataset.purgeYes);
    return;
  }
  if (b.dataset.id) {
    if (selMode) {                                      // 고르는 중엔 카드를 누르면 고름/풂
      const id = b.dataset.id;
      if (picked.has(id)) picked.delete(id); else picked.add(id);
      selAsk = false; renderCards();
      return;
    }
    location.assign("intake.html?id=" + encodeURIComponent(b.dataset.id) + "&step=1");
    return;
  }
  if (b.id === "selBtn") { selMode = true; selAsk = false; picked.clear(); renderCards(); return; }
  if (b.id === "selCancel") { selMode = false; selAsk = false; picked.clear(); renderCards(); return; }
  if (b.id === "selDel") { selAsk = true; renderSelBar(); return; }
  if (b.id === "selNo") { selAsk = false; renderSelBar(); return; }
  if (b.id === "selYes") { trashPicked(b); return; }
});
$("#main").addEventListener("input", (e) => {
  if (!cur && e.target.id === "newName") $("#newGo").disabled = !e.target.value.trim();
});
$("#main").addEventListener("keydown", (e) => {
  if (!cur && e.target.id === "newName" && e.key === "Enter" && e.target.value.trim()) { e.preventDefault(); newIntake(); }
});

async function newIntake() {
  const name = (($("#newName") || {}).value || "").trim();
  if (!name) return;
  const btn = $("#newGo"); if (btn) btn.disabled = true;
  const sel = K.defaults(BASE || CAT.bases[0]);
  try {
    const row = await store.create({ product_name: name, base_type: "sleeve_top", catalog_version: CAT.version, parts: tokensOf(sel), data: { sel } });
    location.assign("intake.html?id=" + encodeURIComponent(row.id) + "&step=1");
  } catch (e) {
    if (btn) btn.disabled = false;
    toast("새 의뢰를 만들지 못했어요 — " + errText(e));
  }
}

/* ---------- 의뢰 열기 ---------- */
async function openIntake(id, s) {
  try { cur = await store.get(id); }
  catch (e) { toast("의뢰를 열지 못했어요 — " + errText(e)); showList(); history.replaceState(null, "", "intake.html"); return; }
  BASE = CAT.bases.find((b) => b.key === (cur.base_type || "sleeve_top")) || CAT.bases[0];
  D = cur.data = normData(cur.data);
  showConfirm = false;
  cur.product_name = cur.product_name || ""; cur.size_label = cur.size_label || "";
  readOnly = !canEdit(cur);
  showRo();
  $("#backBtn").classList.remove("hidden");
  $("#steps").classList.remove("hidden");
  $("#foot").classList.remove("hidden");
  setSave("saved");
  restoreBackup();
  resolveNow();
  go(s);
}
function showRo() {
  $("#roNote").textContent = cur.deleted_at ? "휴지통에 있는 의뢰라 볼 수만 있어요"
    : cur.status === "reviewed" ? "검토 완료된 의뢰라 고칠 수 없어요" : "다른 사람의 의뢰라 볼 수만 있어요";
  $("#roNote").classList.toggle("hidden", !readOnly);
}

/* ---------- 저장 못 한 입력 보관 (폰이 꺼지거나 전파가 끊겨도 이 기기에 남긴다) ---------- */
const backupKey = () => "grader-intake-unsaved-" + cur.id;
function backup() { try { localStorage.setItem(backupKey(), JSON.stringify({ at: new Date().toISOString(), patch: pending })); } catch (e) {} }
function dropBackup() { try { localStorage.removeItem(backupKey()); } catch (e) {} }
function restoreBackup() {
  let b = null;
  try { b = JSON.parse(localStorage.getItem(backupKey()) || "null"); } catch (e) {}
  if (!b || !b.patch) return;
  // 서버 쪽이 더 나중에 고쳐졌으면(다른 기기) 이 보관본은 낡았다 — 버린다
  if (readOnly || (cur.updated_at && Date.parse(cur.updated_at) > Date.parse(b.at))) { dropBackup(); return; }
  const p = b.patch;
  delete p.status;                                      // 실패한 제출을 몰래 다시 내지 않는다
  for (const k of ["product_name", "size_label", "ref_url", "note", "parts"]) if (k in p) cur[k] = p[k];
  if (p.data) D = cur.data = normData(p.data);
  pending = Object.assign(p, { data: D });
  setSave("pending");
  saveTimer = setTimeout(flush, 300);
  toast("저장 못 한 입력을 되살렸어요");
}
function resolveNow() { R = K.resolve(CAT, BASE.key, D.sel) || { shots: [], measures: [], questions: [] }; }

function go(n) {
  step = n;
  history.replaceState(null, "", "intake.html?id=" + encodeURIComponent(cur.id) + "&step=" + n);
  renderBar(); renderSteps(); renderStep();
  $("#prevBtn").disabled = n === 1;
  $("#nextBtn").textContent = n === 5 ? "목록으로" : "다음";
  window.scrollTo(0, 0);
}
function renderBar() {
  $("#barTitle").textContent = cur.product_name || "새 의뢰";
  $("#barEdit").classList.toggle("hidden", readOnly);           // 제목을 누르면 이름 고치는 단계로
  $("#barTitleBox").classList.toggle("is-link", !readOnly);
  $("#barSub").textContent = cur.code + " · " + (STATUS[cur.status] || cur.status) + (cur.size_label ? " · " + cur.size_label : "");
}

/* ---------- 채움 판정 ---------- */
const shotDone = (k) => (D.photos[k] || []).length > 0;
const shotSkip = (k) => !shotDone(k) && typeof D.skipped[k] === "string" && D.skipped[k].trim() !== "";
function measureLeft(m) {
  const e = D.measures[m.key] || {}, v = e.values || {}, sk = e.skip || {};
  return m.values.filter((x) => !(typeof v[x.key] === "number") && !sk[x.key]);
}
const measureDone = (m) => measureLeft(m).length === 0;
function questionDone(q) {
  const a = D.answers[q.key] || {};
  return q.type === "text" ? !!(a.text || "").trim() : !!a.choice;
}
function missing() {
  const out = [];
  for (const gk of Object.keys(D.aiCheck || {})) {        // AI 가 «확인 필요»로 남긴 묶음
    const g = gk === "base" ? { name: "기본 형태" } : BASE.groups.find((x) => x.key === gk);
    if (g) out.push({ step: 1, kind: "check", label: "옷 고르기 · " + g.name + " 확인" });
  }
  if (!cur.product_name.trim()) out.push({ step: 2, label: "제품 이름" });
  if (!cur.size_label) out.push({ step: 2, label: "실물 사이즈" });
  R.shots.forEach((s, i) => {
    if (shotDone(s.key) || shotSkip(s.key)) return;
    out.push({ step: 3, kind: "shot", i, label: "사진 " + (i + 1) + " · " + s.title + (s.key in D.skipped ? " (못 찍은 이유)" : "") });
  });
  R.measures.forEach((m, i) => {
    const left = measureLeft(m);
    if (left.length) out.push({ step: 4, kind: "measure", i, label: "치수 " + (i + 1) + " · " + m.title + (m.values.length > 1 ? " (" + left.map((x) => x.label).join("·") + ")" : "") });
  });
  R.questions.forEach((q, i) => { if (!q.optional && !questionDone(q)) out.push({ step: 5, kind: "question", i, key: q.key, label: "질문 " + (i + 1) + " · " + q.title }); });
  return out;
}
function counts() {
  return {
    shots: R.shots.filter((s) => shotDone(s.key) || shotSkip(s.key)).length,
    measures: R.measures.filter(measureDone).length,
    questions: R.questions.filter((q) => q.optional || questionDone(q)).length,
  };
}

function renderSteps() {
  const c = counts();
  const nCheck = Object.keys(D.aiCheck || {}).length;
  const extra = [nCheck ? "확인 " + nCheck : "", "", c.shots + "/" + R.shots.length, c.measures + "/" + R.measures.length, c.questions + "/" + R.questions.length];
  const done = [!nCheck, !!(cur.product_name.trim() && cur.size_label), c.shots === R.shots.length, c.measures === R.measures.length, c.questions === R.questions.length];
  $("#steps").innerHTML = STEPS.map((name, i) =>
    '<button class="ik-step' + (done[i] ? " is-done" : "") + '" type="button" data-step="' + (i + 1) + '"' + (step === i + 1 ? ' aria-current="step"' : "") + ">" +
      (i + 1) + " " + name + (extra[i] ? " <em>" + extra[i] + "</em>" : "") + "</button>").join("");
  const curBtn = $("#steps [aria-current]");
  if (curBtn) curBtn.scrollIntoView({ block: "nearest", inline: "center" });
}

/* ---------- 저장 ---------- */
let pending = {}, saveTimer = null, inflight = null;
const deletedPaths = new Set();                         // 이 기기에서 지운 사진 — 합칠 때 되살리지 않는다
function setSave(state, err) {
  const el = $("#saveState");
  el.classList.toggle("is-error", state === "error");
  el.title = state === "error" && err ? errText(err) : "";
  el.innerHTML = state === "saved" ? '<span class="material-symbols-outlined">cloud_done</span>저장됨'
    : state === "saving" || state === "pending" ? '<span class="spinner" style="width:12px;height:12px"></span>저장 중'
    : state === "error" ? '<span class="material-symbols-outlined">error</span>저장 안 됨 · 다시' : "";
}
function change(fields, now) {
  if (readOnly || !cur) return;
  Object.assign(pending, fields || {}, { data: D });
  backup();
  setSave("pending");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, now ? 0 : 700);
}
// 다른 기기에서 올린 사진은 살린다 (나머지 칸은 이 화면 내용으로 저장)
function mergePhotos(other) {
  for (const [k, list] of Object.entries((other && other.photos) || {})) {
    const mine = D.photos[k] || [];
    for (const p of list || []) if (p && p.path && !deletedPaths.has(p.path) && !mine.some((x) => x.path === p.path)) mine.push(p);
    if (mine.length) D.photos[k] = mine;
  }
}
function lockReadOnly(row) {
  if (row) { cur.status = row.status; cur.deleted_at = row.deleted_at; }
  readOnly = true; pending = {}; dropBackup();
  showRo(); renderBar(); renderSteps(); renderStep();
  if (sheet) renderSheet();
}
// 저장 — 끝날 때까지 기다리고 성공(true)·실패(false)를 돌려준다. 저장 중이면 그 저장이 끝난 뒤 이어서 한다.
async function flush() {
  clearTimeout(saveTimer);
  while (inflight) { try { await inflight; } catch (e) {} }
  if (!cur || !Object.keys(pending).length) return true;
  if (readOnly) { pending = {}; return false; }
  const patch = pending; pending = {};
  setSave("saving");
  inflight = (async () => {
    try {
      return await store.update(cur.id, patch, cur.updated_at);
    } catch (e) {
      // 휴지통에 든 의뢰(다른 기기에서 옮김)는 DB 트리거가 오류로 막는다 — 0줄과 같이 다시 읽어 잠근다
      if (!isNoRow(e) && !/INTAKE_TRASHED/.test((e && e.message) || "")) throw e;
      // 0줄 — 그사이 다른 곳에서 고쳤거나, 이제 고칠 수 없게 됐다. 다시 읽어 가른다
      const fresh = await store.get(cur.id);
      if (!canEdit(fresh)) { lockReadOnly(fresh); throw new Error("NOEDIT"); }
      mergePhotos(fresh.data);
      if (fresh.data && fresh.data.build) D.build = fresh.data.build;   // 서버가 적은 패턴 결과(data.build)는 화면 쪽 옛 값으로 덮지 않는다
      cur.updated_at = fresh.updated_at;
      if (patch.data) patch.data = D;
      return await store.update(cur.id, patch, cur.updated_at);
    }
  })();
  try {
    const r = await inflight;
    cur.status = r.status || cur.status; cur.updated_at = r.updated_at; cur.submitted_at = r.submitted_at || cur.submitted_at;
    if (Object.keys(pending).length) { setSave("pending"); backup(); } else { setSave("saved"); dropBackup(); }
    return true;
  } catch (e) {
    if (e && e.message === "NOEDIT") { setSave(""); toast(errText(e)); return false; }
    pending = Object.assign(patch, pending);
    backup();
    setSave("error", e);
    toast("저장하지 못했어요 — " + errText(e));
    return false;
  } finally {
    inflight = null;
  }
}
$("#saveState").addEventListener("click", async () => {
  if (!$("#saveState").classList.contains("is-error")) return;
  if (/로그인/.test($("#saveState").title) && !(await store.refresh())) { location.assign("login.html?next=intake.html"); return; }
  flush();
});
async function leave() {                                // 목록으로 — 저장이 안 되면 떠나지 않는다
  if (await flush()) location.assign("intake.html");
}
window.addEventListener("beforeunload", (e) => { if (inflight || Object.keys(pending).length) { flush(); e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });

/* ---------- 단계 그리기 ---------- */
function renderStep() {
  const main = $("#main");
  if (step === 1) main.innerHTML = stepPick();
  else if (step === 2) main.innerHTML = stepInfo();
  else if (step === 3) main.innerHTML = stepList("shot");
  else if (step === 4) main.innerHTML = stepList("measure");
  else main.innerHTML = stepFinish();
  if (readOnly) main.querySelectorAll("input, textarea, select, button[data-edit]").forEach((el) => { el.disabled = true; });
  if (step === 3 || step === 1) loadThumbs();
}

// «사진으로 옷 모양 맞추기» 카드 — 앞·뒤 전체 사진은 3단계의 «앞 전체 · 겉»·«뒤 전체 · 겉» 칸에 그대로 들어간다
function aiCard() {
  if (!VISION || readOnly) return "";
  const shot = (key, label, view) => {
    const p = (D.photos[key] || [])[0], busy = uploading[key] || 0;
    const ph = busy ? '<div class="ik-ai__ph"><div class="spinner"></div></div>'
      : p ? '<img class="ik-ai__ph" alt="' + label + '" data-thumb="' + esc(p.path) + '">'
      : '<div class="ik-ai__ph ik-ai__ph--empty">' + K.render(D.sel, { view, frame: ["whole"] }, { label }) + "</div>";
    return '<div class="ik-ai__shot">' + ph + '<div class="ik-ai__lbl">' + label + (p ? " ✓" : "") + "</div>" +
      '<div class="ik-ai__btns"><button class="btn btn--secondary btn--sm" type="button" data-edit data-aishot="' + key + '" data-src="cam"><span class="material-symbols-outlined">photo_camera</span>찍기</button>' +
      '<button class="btn btn--ghost btn--sm" type="button" data-edit data-aishot="' + key + '" data-src="lib">앨범</button></div></div>';
  };
  const hasFront = (D.photos.front_out || []).length > 0;
  return '<section class="ik-ai"><div class="ik-ai__head"><span class="material-symbols-outlined">auto_awesome</span>사진으로 옷 모양 맞추기</div>' +
    '<p class="ik-ai__rule"><b>소매 끝·밑단까지 전부 화면 안에, 소매는 펴서</b> 위에서 찍어요.</p>' +
    // 뒤 → 앞 순서 — 앞을 나중에 찍어야 옷이 앞판 위로 놓인 채 3단계 사진(앞판 쪽부터)으로 이어진다
    '<div class="ik-ai__shots">' + shot("back_out", "뒤 전체", "back") + shot("front_out", "앞 전체", "front") + "</div>" +
    '<button class="btn btn--primary btn--block" type="button" data-edit id="aiRun"' + (!hasFront || aiBusy ? " disabled" : "") + ">" +
      (aiBusy ? '<span class="spinner ik-ai__spin"></span>옷 모양 보는 중…' : D.ai ? "다시 보기" : "옷 모양 보기") + "</button>" +
    (aiMsg ? '<div class="ik-ai__msg">' + esc(aiMsg).replace(/\n/g, "<br>") + "</div>" : "") + "</section>";
}

function stepPick() {
  const sel = D.sel;
  const ai = (D.ai && D.ai.result) || null, checks = D.aiCheck || {};
  // AI 가 고른 칩 표시 — 확신 낮음이면 «AI?» (고르지 않고 확인만 부탁한 것)
  const aiTag = (g, o) => {
    if (!ai) return "";
    const hit = g.pick === "many" ? (ai.extras || []).find((e) => e.key === o.key) : ((ai[g.key] || {}).value === o.key ? ai[g.key] : null);
    return hit ? '<span class="ik-aitag">' + (CONF_OK(hit.confidence) ? "AI" : "AI?") + "</span>" : "";
  };
  let h = '<h2 class="ik-h2">옷 고르기</h2>' + aiCard();
  h += '<div class="ik-garment"><figure>' + K.render(sel, { view: "front" }, { label: "앞" }) + "<figcaption>앞</figcaption></figure>" +
    "<figure>" + K.render(sel, { view: "back" }, { label: "뒤" }) + "<figcaption>뒤</figcaption></figure></div>";
  const checkNote = (k) => (k in checks ? '<div class="ik-check-note">확인 필요' + (checks[k] ? " · " + esc(checks[k]) : "") + "</div>" : "");
  h += '<div class="ik-group' + ("base" in checks ? " is-check" : "") + '"><div class="ik-group__name">기본 형태</div><div class="ik-chips">' + CAT.bases.map((b) =>
    '<button class="ik-chip" type="button"' + (b.ready ? ' data-edit data-base="' + b.key + '" aria-pressed="' + (b.key === BASE.key) + '"' : " disabled") + ">" +
      esc(b.name) + (b.ready ? "" : "<small>준비 중</small>") + (ai && (ai.base || {}).value === b.key ? '<span class="ik-aitag">AI</span>' : "") + "</button>").join("") +
    '</div><div class="ik-hint">' + esc(BASE.desc || "") + "</div>" + checkNote("base") + "</div>";
  for (const g of BASE.groups) {
    const on = (o) => (g.pick === "many" ? (sel[g.key] || []).includes(o.key) : sel[g.key] === o.key);
    const hints = g.options.filter((o) => o.hint && on(o)).map((o) => o.name + ": " + o.hint).join(" · ");
    h += '<div class="ik-group' + (g.key in checks ? " is-check" : "") + '"><div class="ik-group__name">' + esc(g.name) + (g.pick === "many" ? " (여러 개)" : "") + '</div><div class="ik-chips">' +
      g.options.map((o) => '<button class="ik-chip" type="button" data-edit data-g="' + g.key + '" data-o="' + o.key + '" aria-pressed="' + on(o) + '">' + esc(o.name) +
        aiTag(g, o) + "</button>").join("") +
      "</div>" + (hints ? '<div class="ik-hint">' + esc(hints) + "</div>" : "") + checkNote(g.key) + "</div>";
  }
  h += '<div class="ik-count"><span><b>' + R.shots.length + "</b>사진</span><span><b>" + R.measures.length + "</b>치수</span><span><b>" + R.questions.length + "</b>구조 질문</span></div>";
  return h;
}

function stepInfo() {
  const sizes = CAT.sizes || [];
  let h = '<h2 class="ik-h2">기본 정보</h2>';
  h += '<div class="ik-field"><label for="fName">제품 이름 <span class="ik-req">*</span></label><input class="input" id="fName" data-f="product_name" autocomplete="off" placeholder="예: 레이지비 럭비 저지" value="' + esc(cur.product_name) + '"></div>';
  h += '<div class="ik-field"><label for="fSize">실물 사이즈 <span class="ik-req">*</span></label><select class="input" id="fSize" data-f="size_label"><option value="">고르기</option>' +
    sizes.map((s) => "<option" + (s === cur.size_label ? " selected" : "") + ">" + esc(s) + "</option>").join("") + "</select></div>";
  h += '<div class="ik-field"><label for="fUrl">판매 링크</label><input class="input" id="fUrl" data-f="ref_url" type="url" inputmode="url" autocomplete="off" placeholder="https://" value="' + esc(cur.ref_url || "") + '"></div>';
  h += '<div class="ik-field"><label for="fNote">현장 메모</label><textarea class="input" id="fNote" data-f="note" rows="3">' + esc(cur.note || "") + "</textarea></div>";
  if (cur.status === "draft" && !readOnly) {
    h += '<div class="ik-danger" id="delZone"><button class="ik-linkbtn" type="button" id="delAsk">휴지통으로 옮기기</button></div>';
  }
  return h;
}

function itemState(kind, it) {
  if (kind === "shot") {
    const n = (D.photos[it.key] || []).length;
    if (n) return { cls: "is-done", html: '<img alt="" data-thumb="' + esc(D.photos[it.key][0].path) + '">' + n + "장" };
    if (shotSkip(it.key)) return { cls: "is-skip", html: "못 찍음" };
    return { cls: "", html: "" };
  }
  const e = D.measures[it.key] || {}, v = e.values || {}, sk = e.skip || {};
  const parts = it.values.map((x) => (typeof v[x.key] === "number" ? v[x.key] : sk[x.key] || "")).filter((x) => x !== "");
  if (!parts.length) return { cls: "", html: "" };
  const allSkip = it.values.every((x) => sk[x.key]);
  return { cls: measureDone(it) ? (allSkip ? "is-skip" : "is-done") : "", html: esc(parts.join(" / ")) };
}
function stepList(kind) {
  const items = kind === "shot" ? R.shots : R.measures;
  const rules = kind === "shot" ? CAT.rules.photo : CAT.rules.measure;
  let h = '<h2 class="ik-h2">' + (kind === "shot" ? "사진" : "치수") + "</h2>";
  h += '<ul class="ik-rules">' + rules.map((r) => "<li>" + esc(r) + "</li>").join("") + "</ul>";
  let pose = null;
  h += '<ol class="ik-items">' + items.map((it, i) => {
    const s = itemState(kind, it);
    // 사진은 옷을 놓는 자세(앞판 위 → 뒤판 위 → 안팎 뒤집기)가 바뀌는 자리에 제목을 단다 — 같은 자세끼리 몰아 찍게
    let head = "";
    if (kind === "shot" && it.pose && it.pose !== pose) {
      pose = it.pose;
      head = '<li class="ik-pose"><span class="material-symbols-outlined">' + (pose === "front" ? "checkroom" : "flip") + "</span>" + esc(CAT.poses[pose] || "") + "</li>";
    }
    return head + '<li><button class="ik-item ' + s.cls + '" type="button" data-open="' + kind + '" data-i="' + i + '">' +
      '<span class="ik-item__num">' + (i + 1) + "</span>" +
      '<span class="ik-item__main"><b>' + esc(it.title) + "</b><small>" + esc(it.where) + "</small></span>" +
      '<span class="ik-item__state">' + s.html + "</span></button></li>";
  }).join("") + "</ol>";
  return h;
}
async function loadThumbs() {
  for (const img of document.querySelectorAll("#main img[data-thumb]")) {
    try { img.src = await store.url(img.dataset.thumb); } catch (e) {}
  }
}

function stepFinish() {
  let h = '<h2 class="ik-h2">구조 질문</h2>';
  R.questions.forEach((q, i) => {
    const a = D.answers[q.key] || {};
    h += '<div class="ik-q" id="q-' + q.key + '"><div class="ik-q__title"><span>' + (i + 1) + "</span>" + esc(q.title) + (q.optional ? ' <small class="ik-muted">(비워도 돼요)</small>' : "") + "</div>";
    if (q.type === "text") {
      h += '<input class="input" data-edit data-qtext="' + q.key + '" autocomplete="off" placeholder="' + esc(q.hint || "") + '" value="' + esc(a.text || "") + '">';
    } else {
      h += '<div class="ik-chips">' + q.options.map((o) => '<button class="ik-chip" type="button" data-edit data-q="' + q.key + '" data-opt="' + esc(o) + '" aria-pressed="' + (a.choice === o) + '">' + esc(o) + "</button>").join("") + "</div>";
      if (q.hint) h += '<div class="ik-hint">' + esc(q.hint) + "</div>";
      h += '<input class="input" data-edit data-qnote="' + q.key + '" autocomplete="off" placeholder="덧붙일 말 (있으면)" value="' + esc(a.note || "") + '">';
    }
    h += "</div>";
  });

  h += '<h2 class="ik-h3">따로 붙은 조각</h2><p class="ik-muted" style="margin:-4px 0 10px">목록에 없는 조각이 있으면 이름·위치·크기를 적어요.</p>';
  D.extras.forEach((x, i) => {
    h += '<div class="ik-extra">' +
      '<div class="ik-field ik-full"><label for="xn' + i + '">이름</label><input class="input" id="xn' + i + '" data-x="' + i + '" data-xf="name" autocomplete="off" placeholder="예: 어깨 덧댐" value="' + esc(x.name || "") + '"></div>' +
      '<div class="ik-field ik-full"><label for="xw' + i + '">어디에</label><input class="input" id="xw' + i + '" data-x="' + i + '" data-xf="where" autocomplete="off" value="' + esc(x.where || "") + '"></div>' +
      '<div class="ik-field"><label for="xh' + i + '">높이 (cm)</label><input class="input" id="xh' + i + '" data-x="' + i + '" data-xf="height" inputmode="decimal" autocomplete="off" value="' + esc(x.height == null ? "" : x.height) + '"></div>' +
      '<div class="ik-field"><label for="xd' + i + '">폭 (cm)</label><input class="input" id="xd' + i + '" data-x="' + i + '" data-xf="width" inputmode="decimal" autocomplete="off" value="' + esc(x.width == null ? "" : x.width) + '"></div>' +
      '<div class="ik-field ik-full"><button class="ik-linkbtn" type="button" data-edit data-xdel="' + i + '">이 조각 지우기</button></div></div>';
  });
  h += '<button class="btn btn--secondary btn--block" type="button" data-edit id="xAdd"><span class="material-symbols-outlined">add</span>조각 추가</button>';

  const miss = missing();
  h += '<div class="ik-submit" id="submitBox">';
  if (cur.status === "submitted") {
    h += '<div class="ik-ok">제출했어요 · ' + esc(when(cur.submitted_at)) + '</div><div class="ik-muted">검토 완료 전까지는 고칠 수 있어요.</div>';
    if (miss.length) h += '<div class="ik-q__title">제출한 뒤 빈 칸이 생겼어요 · ' + miss.length + "개</div><ul class=\"ik-missing\">" + miss.map((m, k) => '<li><button type="button" data-miss="' + k + '">' + esc(m.label) + "</button></li>").join("") + "</ul>";
  } else if (cur.status === "reviewed") h += '<div class="ik-ok">검토 완료</div>';
  if (cur.status !== "draft") h += buildBox();
  if (cur.status === "draft") {
    if (miss.length) {
      h += '<div class="ik-q__title">아직 빈 칸 ' + miss.length + "개</div><ul class=\"ik-missing\">" + miss.map((m, k) => '<li><button type="button" data-miss="' + k + '">' + esc(m.label) + "</button></li>").join("") + "</ul>";
    } else h += '<div class="ik-ok">다 채웠어요.</div>';
    h += '<button class="btn btn--primary btn--block btn--lg" type="button" data-edit id="submitBtn"' + (miss.length ? " disabled" : "") + ">제출하기</button>";
  }
  h += "</div>";
  return h;
}

/* ---------- 패턴 자동 제작(2026-10-22) ----------
   제출하면 그레이더가 치수로 패턴을 그리고 S~3XL 로 그레이딩한다(POST /api/cad/intake/{id}/build → 작업 번호를 1초마다 본다).
   관리자가 누르면 재단 패턴에 «검토 대기» 판으로 저장, 직원은 만들기만 하고 확인표가 의뢰에 붙는다(창고 쓰기는 관리자만). */
let BUILD = null;                                       // 지금 화면 의뢰의 진행 중 작업 { id, job, stage, done, total, err }
let PICK = null;                                        // 사이즈 추가 그레이딩에서 고른 사이즈 { id, set }
let showConfirm = false;
function buildBox() {
  const b = D.build || null, live = BUILD && BUILD.id === cur.id ? BUILD : null;
  let h = '<div class="ik-build" id="buildBox"><div class="ik-q__title">패턴</div>';
  if (live && !live.err) {
    h += '<div class="ik-muted">패턴 만드는 중 · ' + esc(live.stage || "차례 기다림") + (live.total ? " (" + live.done + "/" + live.total + ")" : "") + "</div>";
    return h + "</div>";
  }
  const done = !!(b && (b.status === "built" || b.status === "stored"));
  const err = (live && live.err) || (b && (b.status === "error" || b.error) && b.error);
  if (err) h += '<div class="ik-build__err">패턴을 만들지 못했어요 — ' + esc(err) + "</div>";
  if (done) {
    const as = (b.assumed || []).length, only = (b.sizes || []).length === 1;
    h += '<div class="ik-ok">' + (b.status === "stored" ? "재단 패턴 v" + esc(b.ver) + " 저장 · 검토 대기" : only ? "기준 사이즈 " + esc(b.base_size || b.sizes[0]) + " 패턴 완성" : "패턴 완성") + "</div>" +
      '<div class="ik-muted">' + esc((b.sizes || []).join("·")) + " · 조각 " + esc(b.pieces) + (as ? " · 가정한 증분 " + as + "칸(확인표 ※)" : "") + "</div>";
    const st = b.status === "stored" ? b : b.last_stored;   // 직원이 다시 만들어도 관리자가 저장한 판은 남는다
    if (st && st.ver) h += (b.status === "stored" ? "" : '<div class="ik-muted">저장된 판: 재단 패턴 v' + esc(st.ver) + " · " + esc((st.sizes || []).join("·")) + "</div>") +
      '<button class="btn btn--secondary btn--block" style="margin-top:8px" type="button" id="patOpen" data-cad="' + esc(encodeURIComponent(st.style_id) + "/v" + encodeURIComponent(st.ver)) + '"><span class="material-symbols-outlined">straighten</span>재단 패턴 보기</button>';
    if (b.status !== "stored" && !store.isAdmin) h += '<div class="ik-muted">재단 패턴 저장은 관리자가 확인표를 보고 해요.</div>';
    if (b.confirm_md) h += '<button class="btn btn--ghost btn--block" style="margin-top:8px" type="button" id="patConfirm">' + (showConfirm ? "확인표 접기" : "확인표 보기") + "</button>" +
      (showConfirm ? '<pre class="ik-build__md">' + esc(b.confirm_md) + "</pre>" : "");
  }
  if (store.mode !== "real") return h + "</div>";

async function startBuild(sizes) {                     // sizes 없으면 기준 사이즈만 — 있으면 기준 + 그 사이즈들

  const id = cur.id, code = cur.code;
  BUILD = { id, job: "", stage: "", done: 0, total: 0, err: "" }; refreshBuild();
  const auth = async () => { const t = await store.token(); return t ? { Authorization: "Bearer " + t } : {}; };
  try {
    const res = await fetch("/api/cad/intake/" + encodeURIComponent(id) + "/build", sizes && sizes.length
      ? { method: "POST", headers: Object.assign({ "Content-Type": "application/json" }, await auth()), body: JSON.stringify({ sizes }) }
      : { method: "POST", headers: await auth() });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.detail || (res.status === 401 ? "로그인이 끝났어요. 다시 로그인해 주세요." : "서버가 받지 않았어요"));
    BUILD.job = body.job_id; BUILD.total = body.total || 0;

      await new Promise((ok) => setTimeout(ok, 1000));
      const r = await fetch("/api/cad/jobs/" + encodeURIComponent(BUILD.job), { headers: await auth(), cache: "no-store" });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.detail || "진행 상황을 읽지 못했어요");
      if (j.status === "error") throw new Error(j.error || "패턴을 만들지 못했어요");
      if (j.status === "done") {
        const x = j.result || {};
        const b = { status: x.stored ? "stored" : "built", style_id: x.style_id, ver: x.version, sizes: x.sizes, pieces: x.pieces,
          base_size: x.base_size, available: x.available || [], assumed: x.assumed || [], confirm_md: x.confirm_md || "", at: new Date().toISOString() };
        BUILD = null;
        if (cur && cur.id === id) {
          const old = D.build || {};                       // 서버의 _merge_build 와 같은 규칙 — 관리자가 저장한 판은 남긴다
          const last = old.status === "stored" ? { style_id: old.style_id, ver: old.ver, sizes: old.sizes } : old.last_stored;
          if (b.status === "built" && last && last.ver) b.last_stored = last;

        toast(x.stored ? "재단 패턴 v" + x.version + " 에 저장했어요 · " + code : "패턴을 만들었어요 · " + code);
        if (!cur) loadList();
        return;
      }
      BUILD.stage = j.stage_ko || ""; BUILD.done = j.done || 0; BUILD.total = j.total || BUILD.total;
      if (cur && cur.id === id) refreshBuild();
    }
    throw new Error("너무 오래 걸려요. 잠시 뒤 다시 열어 보세요");
  } catch (e) {
