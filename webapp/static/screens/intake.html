    const m = D.measures[it.key] = D.measures[it.key] || {};
    m.values = m.values || {}; m.skip = m.skip || {};
    if (m.skip[b.dataset.skip] === b.dataset.why) delete m.skip[b.dataset.skip];
    else { m.skip[b.dataset.skip] = b.dataset.why; delete m.values[b.dataset.skip]; }
    change(); renderSheet();
  }
});
$("#sheetBody").addEventListener("input", (e) => {
  const el = e.target;
  if (!sheet || readOnly) return;
  const it = (sheet.kind === "shot" ? R.shots : R.measures)[sheet.i];
  if (el.dataset.mv) {
    const m = D.measures[it.key] = D.measures[it.key] || {};
    m.values = m.values || {}; m.skip = m.skip || {};
    const n = parseNum(el.value);
    if (n == null) delete m.values[el.dataset.mv];
    else { m.values[el.dataset.mv] = n; delete m.skip[el.dataset.mv]; }
    const row = el.closest(".ik-val");
    row.querySelectorAll("[data-skip]").forEach((t) => t.setAttribute("aria-pressed", "false"));
    $("#w-" + el.dataset.mv).textContent = numWarn(n == null ? "" : n);
    change();
    return;
  }
  if (el.id === "mNote") { (D.measures[it.key] = D.measures[it.key] || {}).note = el.value; change(); return; }
  if (el.id === "skipWhy") { D.skipped[it.key] = el.value; change(); }
});
$("#sheetBody").addEventListener("change", (e) => {
  if (e.target.id !== "skipChk" || !sheet || readOnly) return;
  const it = R.shots[sheet.i];
  if (e.target.checked) D.skipped[it.key] = D.skipped[it.key] || "";
  else delete D.skipped[it.key];
  change(); renderSheet();
  const why = $("#skipWhy"); if (why) why.focus();
});

/* ---------- 사진 올리기: 폰에서 1600px 로 줄여 바로 올린다 ---------- */
async function shrink(file) {
  let src, objUrl = null;
  try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch (e) {
    objUrl = URL.createObjectURL(file);
    try {
      src = await new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => res(img);
        img.onerror = () => rej(new Error("이 사진은 열 수 없어요 — 카메라 설정에서 «호환성 우선»으로 찍거나 JPG 로 골라 주세요"));
        img.src = objUrl;
      });
    } catch (err) { URL.revokeObjectURL(objUrl); throw err; }
  }
  try {
    const w0 = src.width || src.naturalWidth, h0 = src.height || src.naturalHeight;
    const k = Math.min(1, 1600 / Math.max(w0, h0));
    const w = Math.round(w0 * k), h = Math.round(h0 * k);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    c.getContext("2d").drawImage(src, 0, 0, w, h);
    const blob = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.85));
    c.width = c.height = 0;                             // 큰 그림판 메모리를 바로 돌려준다 (구형 아이폰)
    if (!blob) throw new Error("사진을 줄이지 못했어요");
    return { blob, w, h };
  } finally {
    if (src && src.close) src.close();
    if (objUrl) URL.revokeObjectURL(objUrl);
  }
}
// 사진을 넣을 칸 — 시트에서 누르면 그 칸, 1단계 «사진으로 맞추기» 카드에서 누르면 앞/뒤 전체 칸
let photoTarget = null;
function refreshPhotoViews() {
  if (sheet) renderSheet();
  if (step === 1 && !sheet) renderStep();
}
async function addPhotos(files) {
  const key = photoTarget || (sheet && sheet.kind === "shot" && R.shots[sheet.i] ? R.shots[sheet.i].key : null);
  photoTarget = null;
  if (!key || readOnly || !files.length) return;
  const room = MAX_PHOTOS - (D.photos[key] || []).length - (uploading[key] || 0);
  const pick = Array.from(files).slice(0, Math.max(0, room));
  if (files.length > pick.length) toast("한 칸에 " + MAX_PHOTOS + "장까지예요");
  uploading[key] = (uploading[key] || 0) + pick.length;
  refreshPhotoViews();
  for (const f of pick) {
    try {
      const { blob, w, h } = await shrink(f);
      const path = "intakes/" + cur.id + "/" + key + "_" + Date.now() + ".jpg";
      await store.upload(path, blob);
      (D.photos[key] = D.photos[key] || []).push({ path, w, h, at: new Date().toISOString() });
      delete D.skipped[key];
      change(null, true);
      await flush();
    } catch (e) {
      toast("사진을 올리지 못했어요 — " + errText(e));
    } finally {
      uploading[key]--;
      refreshPhotoViews();
    }
  }
}

/* ---------- 사진으로 옷 모양 맞추기 (AI) ----------
   앞·뒤 전체 사진을 서버(/api/intake/classify)에 보내 1단계 선택지를 미리 골라 받는다.
   · 확신 높음·보통 → 그 칩을 고른다(«AI» 표시) · 낮음·모름 → «확인 필요»(직원이 칩을 눌러 확인해야 사라진다)
   · AI 가 고른 것은 D.ai 에 그대로 남긴다 — 나중에 «AI 제안 vs 최종 선택»으로 현장 정확도를 잰다 */
let aiBusy = false, aiMsg = "";
async function photoBlob(key) {
  const p = (D.photos[key] || [])[0];
  if (!p) return null;
  const res = await fetch(await store.url(p.path));
  if (!res.ok) throw new Error("사진을 다시 읽지 못했어요");
  return res.blob();
}
async function runAi() {
  if (aiBusy || readOnly) return;
  aiBusy = true; aiMsg = ""; renderStep();
  try {
    const fd = new FormData();
    const front = await photoBlob("front_out"), back = await photoBlob("back_out");
    if (!front) throw new Error("앞 전체 사진을 먼저 찍어 주세요");
    fd.append("front", front, "front.jpg");
    if (back) fd.append("back", back, "back.jpg");
    const token = await store.token();
    const res = await fetch("/api/intake/classify", { method: "POST", body: fd, headers: token ? { Authorization: "Bearer " + token } : {} });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      // 실제 실패 이유는 화면에 보이지 않고 의뢰 기록에만 남긴다(원인 찾기용)
      if (body.detail) { D.aiError = { at: new Date().toISOString(), status: res.status, detail: String(body.detail).slice(0, 400) }; change(); }
      throw new Error(body.error || (res.status === 401 ? "로그인이 끝났어요. 다시 로그인해 주세요." : "옷 모양을 보지 못했어요"));
    }
    delete D.aiError;
    applyAi(body);
  } catch (e) {
    aiMsg = "⚠ " + errText(e);
  } finally {
    aiBusy = false;
    renderSteps(); renderStep();
  }
}
const CONF_OK = (c) => c === "high" || c === "medium";
const AI_PREFIX = { neck: "목 ", sleeve: "소매 ", cuff: "소매 끝 ", hem: "밑단 " };   // 요약 문장에서 «접어박기» 가 어디 것인지 알게
function applyAi(body) {
  const r = body.result || {};
  const check = {};
  D.ai = { at: new Date().toISOString(), model: body.model || "", catalog_version: body.catalog_version || "", result: r };
  const baseV = (r.base || {}).value;
  if (baseV && baseV !== BASE.key) {
    const b = CAT.bases.find((x) => x.key === baseV);
    aiMsg = "AI 는 이 옷을 «" + (b ? b.name : "판단 못 함") + "»(으)로 봤어요" + (b && !b.ready ? " — 아직 준비 중인 형태예요." : ". 맞는지 확인해 주세요.");
    D.aiCheck = { base: (r.base || {}).reason || "" };
    change(); return;
  }
  const names = [];
  for (const g of BASE.groups) {
    if (g.pick === "many") continue;
    const a = r[g.key] || {};
    const valid = g.options.some((o) => o.key === a.value);
    if (valid) D.sel[g.key] = a.value;
    if (!valid || !CONF_OK(a.confidence)) {
      check[g.key] = a.value === "other" ? "목록에 없는 모양 — " + (a.note || a.reason || "") : a.value === "unknown" ? "AI 가 판단 못 함 — " + (a.reason || "") : "AI 확신 낮음 — " + (a.reason || "");
    }
    if (valid) names.push((AI_PREFIX[g.key] || "") + g.options.find((o) => o.key === a.value).name);
  }
  const ex = BASE.groups.find((g) => g.pick === "many");
  const sure = [], maybe = [];
  for (const e of r.extras || []) {
    const o = ex.options.find((x) => x.key === e.key);
    if (o && CONF_OK(e.confidence)) sure.push(o.key);
    else maybe.push(o ? o.name + "?" : "목록에 없는 것: " + (e.note || e.reason || ""));
  }
  D.sel[ex.key] = Array.from(new Set((D.sel[ex.key] || []).concat(sure)));
  if (maybe.length) check[ex.key] = "확인해 주세요 — " + maybe.join(" · ");
  sure.forEach((k) => names.push(ex.options.find((o) => o.key === k).name));
  D.aiCheck = check;
  resolveNow();
  change({ parts: tokensOf(D.sel) });
  aiMsg = "AI 는 " + names.join(" · ") + "(으)로 봤어요." + (Object.keys(check).length ? " 노란 칸은 확인해 주세요." : "") +
    (r.photo_notes ? "\n사진 메모: " + r.photo_notes : "");
}
// 노란 «확인 필요» 를 직원이 확인했다 — 그 묶음의 칩을 누르면 사라진다
function confirmGroup(gkey) {
  if (D.aiCheck && gkey in D.aiCheck) { delete D.aiCheck[gkey]; return true; }
  return false;
}
for (const id of ["fileCam", "fileLib"]) {
  $("#" + id).addEventListener("change", (e) => { const fs = Array.from(e.target.files || []); e.target.value = ""; addPhotos(fs); });
}

/* ---------- 앱 설치(PWA) · 연결 상태 ----------
   안드로이드 크롬: 설치 조건(manifest + 서비스워커 + HTTPS)이 맞으면 크롬이 beforeinstallprompt 를 준다 → «설치» 단추
   아이폰 사파리: 설치 단추를 주지 않는다 → «공유 → 홈 화면에 추가» 안내 한 줄(닫으면 다시 안 나온다) */
let installEvt = null;
const INSTALL_KEY = "grader-intake-install-hint-closed";
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function renderInstall() {
  const slot = $("#installSlot");
  if (!slot) return;
  let closed = false;
  try { closed = localStorage.getItem(INSTALL_KEY) === "1"; } catch (e) {}
  const x = '<button class="ik-bar__back" type="button" id="installClose" aria-label="안내 닫기"><span class="material-symbols-outlined">close</span></button>';
  slot.innerHTML = isStandalone() || closed ? ""
    : installEvt ? '<div class="ik-install"><p>홈 화면에 앱으로 설치할 수 있어요</p><button class="btn btn--primary btn--sm" type="button" id="installGo">설치</button>' + x + "</div>"
    : isIOS() ? '<div class="ik-install"><p>아래 공유 단추 → «홈 화면에 추가» 하면 앱처럼 열려요</p>' + x + "</div>"
    : "";
}
async function installApp() {
  if (!installEvt) return;
  const ev = installEvt; installEvt = null;
  ev.prompt();
  try { await ev.userChoice; } catch (e) {}
  renderInstall();
}
function closeInstall() {
  try { localStorage.setItem(INSTALL_KEY, "1"); } catch (e) {}
  renderInstall();
}
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; renderInstall(); });
window.addEventListener("appinstalled", () => { installEvt = null; renderInstall(); });
// 화면 껍데기만 저장하는 서비스워커 — 의뢰·사진·로그인 요청은 언제나 네트워크로 간다(intake-sw.js)
if ("serviceWorker" in navigator) navigator.serviceWorker.register("intake-sw.js", { scope: "./" }).catch(() => {});

// 연결 없음 띠 — 다시 연결되면 못 한 저장을 이어서 한다
function netState() { $("#offlineNote").classList.toggle("hidden", navigator.onLine !== false); }
window.addEventListener("offline", netState);
window.addEventListener("online", () => { netState(); if (cur && !readOnly) flush(); });
netState();

init();
</script>
</body>
